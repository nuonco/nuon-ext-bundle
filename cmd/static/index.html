<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nuon Day-2</title>
<style>
:root{color-scheme:dark;font:14px system-ui;background:#0d1117;color:#e6edf3}body{max-width:1100px;margin:40px auto;padding:0 20px}h1{font-size:24px}section{background:#161b22;border:1px solid #30363d;border-radius:8px;margin:18px 0;padding:18px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #30363d}button{background:#238636;color:white;border:0;border-radius:5px;padding:7px 12px;cursor:pointer}.pill{border-radius:12px;padding:3px 8px;background:#30363d}.healthy,.finished{background:#1f6f3d}.failed,.unhealthy,.degraded{background:#8b2d2d}.muted{color:#8b949e}.detail{padding:12px;background:#0d1117;white-space:pre-wrap}.error{color:#ff7b72}
</style></head>
<body><h1>Nuon Day-2 Operations</h1><div id="error" class="error"></div>
<section><h2>Components health</h2><div id="health">Loading…</div></section>
<section><h2>Refs</h2><div id="refs">Loading…</div></section>
<section><h2>Runs</h2><div id="runs">Loading…</div></section>
<script>
const csrf='{{CSRF_TOKEN}}';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async(path,options={})=>{options.headers={...(options.headers||{}),'X-CSRF-Token':csrf};const r=await fetch(path,options);if(!r.ok)throw new Error((await r.json().catch(()=>({error:r.statusText}))).error);return r.json()};
const table=(heads,rows)=>`<table><thead><tr>${heads.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table>`;
async function loadHealth(){const h=await api('/api/health');const cs=[...(h.latest?.components||[]),...(h.latest?.sandbox_releases||[])];document.querySelector('#health').innerHTML=table(['COMPONENT','TYPE','HEALTH'],cs.map(c=>`<tr><td>${esc(c.component_name||c.release_name||c.component_id)}</td><td>${esc(c.component_type||'helm_release')}</td><td><span class="pill ${esc(c.health)}">${esc(c.health)}</span></td></tr>`))}
async function loadRefs(){const c=await api('/api/catalog');document.querySelector('#refs').innerHTML=table(['NAME','KIND','COMPONENT','CRON',''],c.refs.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.kind)}</td><td>${esc(r.component)}</td><td>${esc(r.cron_schedule)}</td><td><button data-ref="${esc(r.id)}">Run</button></td></tr>`));document.querySelectorAll('[data-ref]').forEach(b=>b.onclick=()=>dispatch(b.dataset.ref,b))}
async function dispatch(ref,b){b.disabled=true;try{const d=await api('/api/dispatch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ref_id:ref})});b.textContent=d.dispatch_id;await loadRuns()}catch(e){show(e)}finally{b.disabled=false}}
async function loadRuns(){const runs=await api('/api/runs');document.querySelector('#runs').innerHTML=table(['RUN ID','REF','KIND','SOURCE','STATUS','STARTED'],runs.map(r=>`<tr class="run" data-run="${esc(r.run_id)}"><td>${esc(r.run_id)}</td><td>${esc(r.ref_id)}</td><td>${esc(r.ref_kind)}</td><td>${esc(r.source)}</td><td><span class="pill ${esc(r.status)}">${esc(r.status)}</span></td><td>${esc(new Date(r.started_at).toLocaleString())}</td></tr><tr id="d-${esc(r.run_id)}" hidden><td colspan="6" class="detail"></td></tr>`));document.querySelectorAll('.run').forEach(x=>x.onclick=()=>detail(x.dataset.run))}
async function detail(id){const row=document.getElementById('d-'+id);if(!row.hidden){row.hidden=true;return}const r=await api('/api/runs/'+encodeURIComponent(id));let drift=r.steps.filter(s=>s.drift).map(s=>`${s.drift.drifted?'DRIFTED':'NO DRIFT'} — resources ${s.drift.resource_changes}, outputs ${s.drift.output_changes}, resource drift ${s.drift.resource_drift}`).join('\n');row.children[0].textContent=r.steps.map(s=>`${s.name}  ${s.kind}  ${s.status}  ${s.job_id||''}${s.error?'  '+s.error:''}`).join('\n')+(drift?'\n\n'+drift:'');row.hidden=false}
function show(e){document.querySelector('#error').textContent=e.message}
async function refresh(){try{await Promise.all([loadHealth(),loadRefs(),loadRuns()]);show({message:''})}catch(e){show(e)}}refresh();setInterval(refresh,5000);
</script></body></html>
