name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read monorepo ref
        id: ref
        run: echo "ref=$(cat MONOREPO_REF | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Checkout nuonco/nuon
        uses: actions/checkout@v4
        with:
          repository: nuonco/nuon
          ref: ${{ steps.ref.outputs.ref }}
          path: nuon

      - uses: actions/setup-go@v5
        with:
          go-version-file: nuon/go.mod
          cache-dependency-path: nuon/go.sum

      - name: Build binaries
        run: |
          mkdir -p dist
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${platform%/*}"
            arch="${platform#*/}"
            echo "building $os/$arch"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go -C nuon build -ldflags "-s -w" \
              -o "$GITHUB_WORKSPACE/dist/nuon-ext-bundle-$os-$arch" ./bins/nuon-bundle
          done
          (cd dist && shasum -a 256 nuon-ext-bundle-* > checksums.txt)

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes "Built from nuonco/nuon @ ${{ steps.ref.outputs.ref }}"
